<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EFF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1524" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吃什么">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>今天吃什么</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E9EFF7;
  --plate:#FFFFFF;
  --rim:#1F4E9C;
  --rim-soft:#C8D6EE;
  --ink:#18212F;
  --muted:#566178;
  --red:#C3262E;
  --red-deep:#861A20;
  --chip:#EEF2F9;
  --c-meat:#B02A30;
  --c-poultry:#A8551C;
  --c-sea:#1C6A86;
  --c-egg:#8A6A00;
  --c-tofu:#6B5A3A;
  --c-veg:#2C7447;
  --c-west:#7A3E9A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1524; --plate:#172238; --rim:#86A8EA; --rim-soft:#2C3C5E; --ink:#E8EDF6; --muted:#A3AEC4;
    --red:#D9434A; --red-deep:#8E1F25; --chip:#1E2B45;
    --c-meat:#F08A8E; --c-poultry:#F0A877; --c-sea:#7CCBE6; --c-egg:#E6C55A; --c-tofu:#D2BE98; --c-veg:#7FD3A0; --c-west:#CDA2E6;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1524; --plate:#172238; --rim:#86A8EA; --rim-soft:#2C3C5E; --ink:#E8EDF6; --muted:#A3AEC4;
  --red:#D9434A; --red-deep:#8E1F25; --chip:#1E2B45;
  --c-meat:#F08A8E; --c-poultry:#F0A877; --c-sea:#7CCBE6; --c-egg:#E6C55A; --c-tofu:#D2BE98; --c-veg:#7FD3A0; --c-west:#CDA2E6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button{font:inherit; color:inherit;}
.wrap{max-width:980px; margin:0 auto; padding:36px 20px 72px;}

.hero h1{
  font-family:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  font-weight:400; font-size:clamp(52px,11vw,96px); line-height:1;
  color:var(--rim); margin:0; letter-spacing:.03em;
}
.hero p{margin:14px 0 0; color:var(--muted); max-width:34em;}

.tray{
  margin-top:28px; background:var(--plate);
  border:3px solid var(--rim); border-radius:24px;
  box-shadow: inset 0 0 0 6px var(--plate), inset 0 0 0 7px var(--rim-soft);
  padding:22px 24px;
  display:flex; flex-wrap:wrap; gap:20px 32px; align-items:center; justify-content:space-between;
}
.people{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.people-label{font-weight:700;}
.seg{display:flex; gap:8px;}
.seg button{
  width:46px; height:46px; border-radius:50%;
  border:2px solid var(--rim); background:var(--plate); color:var(--rim);
  font-weight:700; font-size:17px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--rim); color:var(--plate);}
.seg small{font-size:12px; font-weight:500;}
.actions{display:flex; gap:12px; flex-wrap:wrap;}

.btn{
  border-radius:999px; padding:13px 26px; font-size:18px; font-weight:700; cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn.primary{
  background:var(--red); color:#fff; border:3px solid var(--red-deep);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 var(--red-deep);
}
.btn.secondary{
  background:var(--plate); color:var(--rim); border:3px solid var(--rim);
  box-shadow: 0 4px 0 var(--rim);
}
.btn:active{transform:translateY(3px);}
.btn.primary:active{box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 0 var(--red-deep);}
.btn.secondary:active{box-shadow: 0 1px 0 var(--rim);}

:focus-visible{outline:3px solid var(--red); outline-offset:3px;}

#plan{margin-top:36px;}
.empty{
  text-align:left; color:var(--muted); padding:28px 0;
  border-top:2px dashed var(--rim-soft);
}
.empty strong{color:var(--ink);}

.day{margin-top:34px;}
.day:first-child{margin-top:0;}
.day-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px;}
.day-head h2{
  font-family:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  font-weight:400; font-size:34px; line-height:1.1; margin:0; color:var(--ink);
}
.day-head span{color:var(--muted); font-size:15px;}

.meals{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr)); gap:16px; align-items:start;}

.meal{
  background:var(--plate); border:2px solid var(--rim); border-radius:22px;
  box-shadow: inset 0 0 0 5px var(--plate), inset 0 0 0 6px var(--rim-soft);
  padding:20px 22px 18px;
}
.meal-time{font-size:14px; font-weight:700; color:var(--rim);}
.dish{
  font-family:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  font-weight:400; font-size:32px; line-height:1.15; margin:4px 0 10px;
}
.tags{display:flex; flex-wrap:wrap; gap:6px;}
.tag{background:var(--chip); border-radius:999px; padding:2px 11px; font-size:13px; color:var(--muted);}
.tag.cat{font-weight:700;}
.cat-p,.cat-b{color:var(--c-meat);}
.cat-c{color:var(--c-poultry);}
.cat-f{color:var(--c-sea);}
.cat-e{color:var(--c-egg);}
.cat-d{color:var(--c-tofu);}
.cat-v{color:var(--c-veg);}
.cat-w{color:var(--c-west);}
.tag.hot{color:var(--red); font-weight:700;}

.meal-actions{display:flex; gap:10px; margin-top:16px;}
.pill{
  border:2px solid var(--rim-soft); background:transparent; color:var(--rim);
  border-radius:999px; padding:6px 16px; font-size:15px; font-weight:500; cursor:pointer;
}
.pill:hover{border-color:var(--rim);}
.pill[aria-expanded="true"]{background:var(--rim); border-color:var(--rim); color:var(--plate);}

.recipe{margin-top:18px; padding-top:16px; border-top:2px dashed var(--rim-soft);}
.recipe h4{margin:0 0 6px; font-size:15px; color:var(--rim);}
.recipe h4 + .qty{margin-top:0;}
.qty{list-style:none; margin:0 0 16px; padding:0;}
.qty li{
  display:flex; justify-content:space-between; gap:16px;
  padding:5px 0; border-bottom:1px dotted var(--rim-soft); font-size:15px;
}
.qty li span:last-child{font-variant-numeric:tabular-nums; font-weight:500; white-space:nowrap;}
.staple{font-size:14px; color:var(--muted); margin:-6px 0 16px;}
.steps{margin:0; padding:0; list-style:none; counter-reset:s;}
.steps li{position:relative; padding:0 0 12px 38px; counter-increment:s; font-size:15px;}
.steps li::before{
  content:counter(s); position:absolute; left:0; top:1px;
  width:26px; height:26px; border-radius:50%;
  background:var(--rim); color:var(--plate);
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;
}

.shop-bar{margin-top:30px;}
.shop{
  margin-top:16px; background:var(--plate); border:2px solid var(--rim); border-radius:22px;
  box-shadow: inset 0 0 0 5px var(--plate), inset 0 0 0 6px var(--rim-soft);
  padding:22px 24px;
}
.shop h3{margin:0 0 4px; font-size:20px;}
.shop .sub{margin:0 0 16px; color:var(--muted); font-size:14px;}
.shop-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:4px 32px;}
.shop-h4{margin:10px 0 6px; color:var(--rim); font-size:15px;}
.pantry{color:var(--muted); font-size:15px; margin:0;}

.notes{margin-top:44px; padding-top:20px; border-top:2px dashed var(--rim-soft); color:var(--muted); font-size:14px; max-width:44em;}
.notes p{margin:0 0 8px;}

.reveal{animation:rise .32s ease-out both;}
@keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){
  .reveal{animation:none;}
  .btn{transition:none;}
}
@media (max-width:560px){
  .wrap{padding:24px 16px 56px;}
  .tray{padding:18px;}
  .actions{width:100%;}
  .actions .btn{flex:1 1 100%;}
  .dish{font-size:28px;}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>今天吃什么</h1>
    <p>一天两顿，九成是快手家常菜，偶尔来一顿披萨、意面或者咖喱饭。每道菜都附做法，用量按人数自动换算。</p>
  </header>

  <section class="tray" aria-label="设置">
    <div class="people" role="group" aria-labelledby="peopleLabel">
      <span class="people-label" id="peopleLabel">几个人吃</span>
      <div class="seg" id="seg"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="rollDay" type="button">抽今天的两顿</button>
      <button class="btn secondary" id="rollWeek" type="button">排一周菜单</button>
    </div>
  </section>

  <section id="plan" aria-live="polite"></section>

  <footer class="notes">
    <p>量具换算：1 汤匙 = 15 毫升，1 茶匙 = 5 毫升；盐 1 茶匙约 6 克，白糖 1 茶匙约 4 克。</p>
    <p>焯水、煮面、煮饭用的水不算在用量里，水量没过食材就行。标注的时长包含泡发和腌制，花甲、蛤蜊吐沙的 1 小时另算。</p>
    <p>人数变多时，盐、油、酱料和葱姜蒜不会直接翻倍，而是少放一些，避免太咸太油。</p>
    <p id="libCount"></p>
  </footer>
</main>

function parse(raw){
  return raw.trim().split("\n").filter(Boolean).map(line => {
    const [name, cat, min, ings, steps] = line.split("|");
    return {
      name,
      cat: cat.replace("!",""),
      hot: cat.includes("!"),
      min: +min,
      ings: ings.split(",").map(s => {
        const m = s.trim().match(RE);
        return m ? {n:m[1], q:+m[2], u:m[3]} : {n:s.trim(), q:null, u:""};
      }),
      steps: steps.split(";").map(s => s.trim()).filter(Boolean)
    };
  });
}

/* ---------- 用量换算 ---------- */
function factor(name, n){
  return SEASON.has(name) ? (1 + 0.75 * (n - 1)) / 1.75 : n / 2;
}
function roundQty(v, u, name){
  if (u === "g" || u === "ml"){
    if (v < 5) return Math.max(0.5, Math.round(v * 2) / 2);
    if (v < 20) return Math.round(v);
    if (v < 100) return Math.round(v / 5) * 5;
    return Math.round(v / 10) * 10;
  }
  if (u === "个" && HALF.has(name)) return Math.max(0.5, Math.round(v * 2) / 2);
  return Math.max(1, Math.round(v));
}
function numText(v){
  return Number.isInteger(v) ? String(v) : String(+v.toFixed(1));
}
function qtyText(v, u){
  if (UNIT[u]) return numText(v) + " " + UNIT[u];
  if (v === 0.5) return "半" + u;
  return numText(v) + " " + u;
}
function scaled(ing, n){
  if (ing.q == null) return null;
  return roundQty(ing.q * factor(ing.n, n), ing.u, ing.n);
}

/* ---------- 状态 ---------- */
const STORE_KEY = "meal-picker-v1";
let state = {people: 2, plan: null, open: new Set(), shopOpen: false};

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({people: state.people, plan: state.plan}));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.people >= 1 && d.people <= 5) state.people = d.people;
    if (d && d.plan && Array.isArray(d.plan.days) &&
        d.plan.days.every(x => Array.isArray(x.meals) && x.meals.every(id => ALL[id]))) {
      state.plan = d.plan;
    }
  }catch(e){}
}

/* ---------- 抽菜 ---------- */
function pickOne(used, avoidCat){
  let best = null;
  for (let t = 0; t < 6; t++){
    const pool = Math.random() < 0.1 ? WEST_IDS : HOME_IDS;
    let cand = pool.filter(i => !used.has(i));
    if (!cand.length) cand = pool;
    const id = cand[Math.floor(Math.random() * cand.length)];
    best = id;
    if (!avoidCat || ALL[id].cat !== avoidCat) break;
  }
  return best;
}
function dateInfo(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return {iso: d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(),
          label: `${d.getMonth() + 1}月${d.getDate()}日`, wd: WEEKDAY[d.getDay()]};
}
function makePlan(days){
  const used = new Set();
  const out = [];
  for (let i = 0; i < days; i++){
    const a = pickOne(used); used.add(a);
    const b = pickOne(used, ALL[a].cat); used.add(b);
    const di = dateInfo(i);
    out.push({date: di.label, wd: di.wd, meals: [a, b]});
  }
  return {type: days === 1 ? "day" : "week", days: out};
}
function swap(dayIdx, mealIdx){
  const used = new Set(state.plan.days.flatMap(d => d.meals));
  const other = state.plan.days[dayIdx].meals[1 - mealIdx];
  const id = pickOne(used, ALL[other].cat);
  state.plan.days[dayIdx].meals[mealIdx] = id;
  save();
  render(false);
  const btn = document.querySelector(`[data-swap="${dayIdx}-${mealIdx}"]`);
  if (btn) btn.focus();
}

/* ---------- 渲染 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function recipeHTML(dish, n){
  const main = [], sea = [];
  dish.ings.forEach(ing => {
    const v = scaled(ing, n);
    const row = `<li><span>${esc(ing.n)}</span><span>${v == null ? "" : qtyText(v, ing.u)}</span></li>`;
    (SEASON.has(ing.n) || ing.n === "清水" || ing.n === "温水" ? sea : main).push(row);
  });
  const staple = dish.cat === "w"
    ? `<p class="staple">主食已经包含在这道菜里。</p>`
    : `<p class="staple">配米饭：大米 ${RICE_PER_PERSON * n} 克（每人 ${RICE_PER_PERSON} 克生米）</p>`;
  return `
    <h4>食材（${n} 人份）</h4>
    <ul class="qty">${main.join("")}</ul>
    ${staple}
    <h4>调料和水</h4>
    <ul class="qty">${sea.join("")}</ul>
    <h4>做法</h4>
    <ol class="steps">${dish.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
}

function mealHTML(dayIdx, mealIdx, id){
  const dish = ALL[id];
  const key = `${dayIdx}-${mealIdx}`;
  const open = state.open.has(key);
  const tags = [
    `<span class="tag cat cat-${dish.cat}">${CAT[dish.cat]}</span>`,
    `<span class="tag">约 ${dish.min} 分钟</span>`,
    dish.hot ? `<span class="tag hot">辣</span>` : ""
  ].join("");
  return `
  <article class="meal">
    <div class="meal-time">${mealIdx === 0 ? "午饭" : "晚饭"}</div>
    <h3 class="dish">${esc(dish.name)}</h3>
    <div class="tags">${tags}</div>
    <div class="meal-actions">
      <button class="pill" type="button" data-toggle="${key}" aria-expanded="${open}" aria-controls="r-${key}">${open ? "收起做法" : "看做法"}</button>
      <button class="pill" type="button" data-swap="${key}">换一道</button>
    </div>
    <div class="recipe" id="r-${key}" ${open ? "" : "hidden"}>${open ? recipeHTML(dish, state.people) : ""}</div>
  </article>`;
}

function shopHTML(){
  const n = state.people;
  const food = new Map();
  const pantry = new Set();
  let rice = 0;
  state.plan.days.forEach(d => d.meals.forEach(id => {
    const dish = ALL[id];
    if (dish.cat !== "w") rice += RICE_PER_PERSON * n;
    dish.ings.forEach(ing => {
      if (NO_SHOP.has(ing.n)) return;
      if (SEASON.has(ing.n)) { pantry.add(ing.n); return; }
      const k = ing.n + "|" + ing.u;
      food.set(k, (food.get(k) || 0) + scaled(ing, n));
    });
  }));
  if (rice) food.set("大米|g", (food.get("大米|g") || 0) + rice);
  const rows = [...food.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "zh-Hans-CN"))
    .map(([k, v]) => {
      const [name, u] = k.split("|");
      return `<li><span>${esc(name)}</span><span>${qtyText(Math.round(v * 2) / 2, u)}</span></li>`;
    });
  const half = Math.ceil(rows.length / 2);
  const title = state.plan.type === "day" ? "今天的买菜清单" : "这一周的买菜清单";
  return `
  <div class="shop" id="shopPanel">
    <h3>${title}（${n} 人份）</h3>
    <p class="sub">同一种食材已经合并，按名称排序。</p>
    <div class="shop-cols">
      <ul class="qty">${rows.slice(0, half).join("")}</ul>
      <ul class="qty">${rows.slice(half).join("")}</ul>
    </div>
    <h4 class="shop-h4">要用到的调料（看看家里够不够）</h4>
    <p class="pantry">${[...pantry].map(esc).join("、")}</p>
  </div>`;
}

function render(animate){
  const seg = document.getElementById("seg");
  seg.innerHTML = [1,2,3,4,5].map(i =>
    `<button type="button" data-people="${i}" aria-pressed="${i === state.people}" aria-label="${i} 人">${i}<small>人</small></button>`
  ).join("");

  const plan = document.getElementById("plan");
  if (!state.plan){
    plan.innerHTML = `<div class="empty"><strong>还没抽。</strong> 点上面的“抽今天的两顿”，或者直接排好一整周。</div>`;
    return;
  }
  const days = state.plan.days.map((d, i) => {
    const head = state.plan.type === "day"
      ? `<h2>今天</h2><span>${d.wd}，${d.date}</span>`
      : `<h2>${d.wd}</h2><span>${d.date}</span>`;
    return `<section class="day"><div class="day-head">${head}</div>
      <div class="meals">${d.meals.map((id, m) => mealHTML(i, m, id)).join("")}</div></section>`;
  }).join("");
  const shopBtn = `<div class="shop-bar"><button class="btn secondary" type="button" id="shopBtn" aria-expanded="${state.shopOpen}" aria-controls="shopPanel">${state.shopOpen ? "收起买菜清单" : (state.plan.type === "day" ? "看今天的买菜清单" : "看这一周的买菜清单")}</button>${state.shopOpen ? shopHTML() : ""}</div>`;
  plan.innerHTML = `<div class="${animate ? "reveal" : ""}">${days}${shopBtn}</div>`;
}

/* ---------- 事件 ---------- */
document.getElementById("seg").addEventListener("click", e => {
  const b = e.target.closest("[data-people]");
  if (!b) return;
  state.people = +b.dataset.people;
  save();
  render(false);
  const again = document.querySelector(`[data-people="${state.people}"]`);
  if (again) again.focus();
});
document.getElementById("rollDay").addEventListener("click", () => {
  state.plan = makePlan(1); state.open.clear(); state.shopOpen = false; save(); render(true);
});
document.getElementById("rollWeek").addEventListener("click", () => {
  state.plan = makePlan(7); state.open.clear(); state.shopOpen = false; save(); render(true);
});
document.getElementById("plan").addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){
    const key = t.dataset.toggle;
    state.open.has(key) ? state.open.delete(key) : state.open.add(key);
    render(false);
    const back = document.querySelector(`[data-toggle="${key}"]`);
    if (back) back.focus();
    return;
  }
  const s = e.target.closest("[data-swap]");
  if (s){
    const [d, m] = s.dataset.swap.split("-").map(Number);
    swap(d, m);
    return;
  }
  if (e.target.closest("#shopBtn")){
    state.shopOpen = !state.shopOpen;
    render(false);
    const b = document.getElementById("shopBtn");
    if (b) b.focus();
  }
});

load();
render(false);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
